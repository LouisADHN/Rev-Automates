// ============================================================
// FLASHCARDS COMPONENT
// ============================================================
function Flashcards() {
  const cats = useMemo(() => ["Toutes", ...Array.from(new Set(FLASHCARDS.map((c) => c.cat)))], []);
  const [cat, setCat] = useState("Toutes");
  const deck = useMemo(
    () => FLASHCARDS.filter((c) => cat === "Toutes" || c.cat === cat),
    [cat]
  );
  const [i, setI] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState({});

  useEffect(() => {
    setI(0);
    setFlipped(false);
  }, [cat]);

  const card = deck[i];
  const next = () => {
    setFlipped(false);
    setTimeout(() => setI((i + 1) % deck.length), 120);
  };
  const prev = () => {
    setFlipped(false);
    setTimeout(() => setI((i - 1 + deck.length) % deck.length), 120);
  };
  const markKnown = (val) => {
    setKnown({ ...known, [card.q]: val });
    next();
  };

  const knownCount = Object.values(known).filter(Boolean).length;

  return (
    <div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 18 }}>
        {cats.map((c) => (
          <button
            key={c}
            onClick={() => setCat(c)}
            style={{
              ...chipStyle,
              background: cat === c ? palette.ink : "transparent",
              color: cat === c ? palette.cream : palette.ink,
              borderColor: palette.ink,
            }}
          >
            {c}
          </button>
        ))}
      </div>

      <div style={{ textAlign: "center", marginBottom: 10, fontFamily: "'Space Mono', monospace", fontSize: 13, color: palette.plum }}>
        Carte {i + 1} / {deck.length} · connues : {knownCount}
      </div>

      <div
        onClick={() => setFlipped(!flipped)}
        style={{ perspective: 1600, cursor: "pointer", maxWidth: 620, margin: "0 auto" }}
      >
        <div
          style={{
            position: "relative",
            height: 340,
            transition: "transform .55s cubic-bezier(.2,.8,.2,1)",
            transformStyle: "preserve-3d",
            transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)",
          }}
        >
          {/* FRONT */}
          <div style={{ ...cardFace, background: palette.cream, border: `2px solid ${palette.ink}` }}>
            <div style={faceTag}>{card.cat}</div>
            <div style={{ fontFamily: "'Fraunces', serif", fontSize: 26, fontWeight: 600, lineHeight: 1.25, color: palette.ink }}>
              {card.q}
            </div>
            <div style={faceHint}>cliquer pour retourner ↻</div>
          </div>
          {/* BACK */}
          <div
            style={{
              ...cardFace,
              transform: "rotateY(180deg)",
              background: palette.ink,
              border: `2px solid ${palette.ink}`,
            }}
          >
            <div style={{ ...faceTag, color: palette.gold, borderColor: palette.gold }}>réponse</div>
            <div style={{ fontFamily: "'Outfit', sans-serif", fontSize: 19, lineHeight: 1.45, color: palette.cream }}>
              {card.a}
            </div>
            <div style={{ ...faceHint, color: "#9a8fb0" }}>cliquer pour retourner ↻</div>
          </div>
        </div>
      </div>

      <div style={{ display: "flex", justifyContent: "center", gap: 10, marginTop: 22, flexWrap: "wrap" }}>
        <button onClick={prev} style={navBtn}>← Préc.</button>
        <button onClick={() => markKnown(false)} style={{ ...navBtn, borderColor: palette.rust, color: palette.rust }}>À revoir</button>
        <button onClick={() => markKnown(true)} style={{ ...navBtn, borderColor: palette.teal, color: palette.teal }}>Acquise ✓</button>
        <button onClick={next} style={navBtn}>Suiv. →</button>
      </div>
    </div>
  );
}

function Quiz() {
  const [order] = useState(() => QUIZ.map((_, idx) => idx));
  const [i, setI] = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const [answeredCount, setAnsweredCount] = useState(0);

  const q = QUIZ[order[i]];
  const choices = q.type === "vf" ? ["Vrai", "Faux"] : q.choices;
  const correctIdx = q.type === "vf" ? (q.correct ? 0 : 1) : q.correct;

  const choose = (idx) => {
    if (picked !== null) return;
    setPicked(idx);
    setAnsweredCount((c) => c + 1);
    if (idx === correctIdx) setScore((s) => s + 1);
  };
  const next = () => {
    if (i + 1 >= QUIZ.length) {
      setDone(true);
      return;
    }
    setI(i + 1);
    setPicked(null);
  };
  const restart = () => {
    setI(0);
    setPicked(null);
    setScore(0);
    setDone(false);
    setAnsweredCount(0);
  };

  if (done) {
    const pct = Math.round((score / QUIZ.length) * 100);
    return (
      <div style={{ textAlign: "center", padding: "40px 10px" }}>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 56, fontWeight: 900, color: palette.rust }}>{pct}%</div>
        <div style={{ fontFamily: "'Outfit', sans-serif", fontSize: 22, marginTop: 6 }}>
          {score} / {QUIZ.length} bonnes réponses
        </div>
        <div style={{ marginTop: 16, fontFamily: "'Outfit'", color: palette.plum, fontSize: 16 }}>
          {pct >= 80 ? "Solide. Tu es prêt 💪" : pct >= 50 ? "Bon début — refais les flashcards des catégories ratées." : "Reprends le mémo et les flashcards, puis recommence."}
        </div>
        <button onClick={restart} style={{ ...navBtn, marginTop: 26 }}>Recommencer</button>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 640, margin: "0 auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "'Space Mono', monospace", fontSize: 13, color: palette.plum, marginBottom: 14 }}>
        <span>Q {i + 1}/{QUIZ.length}</span>
        <span>{q.cat}</span>
        <span>Score {score}</span>
      </div>

      <div style={{ height: 6, background: palette.line, borderRadius: 3, marginBottom: 24 }}>
        <div style={{ height: "100%", width: `${((i) / QUIZ.length) * 100}%`, background: palette.gold, borderRadius: 3, transition: "width .3s" }} />
      </div>

      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 24, fontWeight: 600, lineHeight: 1.3, marginBottom: 26 }}>
        {q.q}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {choices.map((c, idx) => {
          let bg = palette.cream, bord = palette.ink, col = palette.ink;
          if (picked !== null) {
            if (idx === correctIdx) { bg = palette.teal; col = "#fff"; bord = palette.teal; }
            else if (idx === picked) { bg = palette.rust; col = "#fff"; bord = palette.rust; }
          }
          return (
            <button
              key={idx}
              onClick={() => choose(idx)}
              style={{
                textAlign: "left", padding: "14px 18px", borderRadius: 12,
                border: `2px solid ${bord}`, background: bg, color: col,
                fontFamily: "'Outfit', sans-serif", fontSize: 17, cursor: picked === null ? "pointer" : "default",
                transition: "all .2s",
              }}
            >
              {c}
            </button>
          );
        })}
      </div>

      {picked !== null && (
        <div style={{ marginTop: 20, padding: "14px 18px", background: palette.paper, borderLeft: `4px solid ${palette.gold}`, borderRadius: 8, fontFamily: "'Outfit'", fontSize: 16, lineHeight: 1.45 }}>
          <strong>{picked === correctIdx ? "✓ Correct. " : "✗ "}</strong>{q.explain}
        </div>
      )}

      {picked !== null && (
        <div style={{ textAlign: "center", marginTop: 22 }}>
          <button onClick={next} style={navBtn}>{i + 1 >= QUIZ.length ? "Voir le score" : "Suivant →"}</button>
        </div>
      )}
    </div>
  );
}

// ============================================================
// SIMULATEUR MOTS & LANGAGES
// ============================================================
function WordSim() {
  const [li, setLi] = useState(0);
  const [input, setInput] = useState("");
  const [result, setResult] = useState(null);
  const lang = SIM_LANGS[li];

  const test = (w) => {
    const word = w !== undefined ? w : input;
    setInput(word);
    setResult(lang.regex.test(word));
  };

  useEffect(() => { setResult(null); setInput(""); }, [li]);

  return (
    <div style={{ maxWidth: 640, margin: "0 auto" }}>
      <p style={{ fontFamily: "'Outfit'", color: palette.plum, fontSize: 15, marginBottom: 16 }}>
        Choisis un langage régulier, tape un mot (sur {"{a,b}"}) et vérifie s'il est reconnu. Les boutons proposent des mots-test.
      </p>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 18 }}>
        {SIM_LANGS.map((l, idx) => (
          <button key={idx} onClick={() => setLi(idx)} style={{
            ...chipStyle, fontFamily: "'Space Mono', monospace",
            background: li === idx ? palette.plum : "transparent",
            color: li === idx ? "#fff" : palette.ink, borderColor: palette.plum,
          }}>
            {l.label}
          </button>
        ))}
      </div>

      <div style={{ background: palette.cream, border: `2px solid ${palette.ink}`, borderRadius: 14, padding: 22 }}>
        <div style={{ fontFamily: "'Space Mono', monospace", fontSize: 20, color: palette.rust, marginBottom: 6 }}>{lang.label}</div>
        <div style={{ fontFamily: "'Outfit'", fontSize: 15, color: palette.ink, marginBottom: 18 }}>{lang.desc}</div>

        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          <input
            value={input}
            onChange={(e) => setInput(e.target.value.replace(/[^ab]/g, ""))}
            placeholder="ex: aabb (mot vide = laisser vide)"
            style={{ flex: 1, padding: "12px 14px", borderRadius: 10, border: `2px solid ${palette.line}`, fontFamily: "'Space Mono', monospace", fontSize: 16 }}
          />
          <button onClick={() => test()} style={{ ...navBtn, margin: 0 }}>Tester</button>
        </div>

        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16 }}>
          {lang.tests.map((t, idx) => (
            <button key={idx} onClick={() => test(t)} style={{
              ...chipStyle, fontFamily: "'Space Mono', monospace", fontSize: 13,
              background: "transparent", color: palette.teal, borderColor: palette.teal,
            }}>
              {t === "" ? "ε" : t}
            </button>
          ))}
        </div>

        {result !== null && (
          <div style={{
            padding: "14px 18px", borderRadius: 10, textAlign: "center",
            fontFamily: "'Fraunces', serif", fontSize: 22, fontWeight: 600,
            background: result ? palette.teal : palette.rust, color: "#fff",
          }}>
            « {input === "" ? "ε" : input} » {result ? "est reconnu ✓" : "n'est PAS reconnu ✗"}
          </div>
        )}
      </div>
    </div>
  );
}

// ============================================================
// EXERCICES À ÉTAPES (déterminisation + Arden partagent le même rendu)
// ============================================================
function StepExercise({ data, kind }) {
  const [ei, setEi] = useState(0);
  const [revealed, setRevealed] = useState(0);
  const [showAns, setShowAns] = useState(false);
  const ex = data[ei];

  const change = (idx) => { setEi(idx); setRevealed(0); setShowAns(false); };

  return (
    <div style={{ maxWidth: 680, margin: "0 auto" }}>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 18 }}>
        {data.map((d, idx) => (
          <button key={idx} onClick={() => change(idx)} style={{
            ...chipStyle, background: ei === idx ? palette.ink : "transparent",
            color: ei === idx ? palette.cream : palette.ink, borderColor: palette.ink,
          }}>
            Exercice {idx + 1}
          </button>
        ))}
      </div>

      <div style={{ background: palette.cream, border: `2px solid ${palette.ink}`, borderRadius: 14, padding: 24 }}>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 20, fontWeight: 600, lineHeight: 1.3, marginBottom: 8 }}>
          {ex.title}
        </div>
        {ex.nfa && <div style={{ fontFamily: "'Outfit'", fontSize: 14, color: palette.plum, marginBottom: 14 }}>{ex.nfa}</div>}

        {ex.system && (
          <div style={{ background: palette.ink, color: palette.cream, borderRadius: 10, padding: "16px 18px", marginBottom: 18, fontFamily: "'Space Mono', monospace", fontSize: 16, lineHeight: 1.7 }}>
            {ex.system.map((s, idx) => <div key={idx}>{s}</div>)}
          </div>
        )}

        <div style={{ fontFamily: "'Space Mono', monospace", fontSize: 12, color: palette.plum, marginBottom: 10, textTransform: "uppercase", letterSpacing: 1 }}>
          Étapes de résolution
        </div>

        <ol style={{ paddingLeft: 22, margin: 0 }}>
          {ex.steps.slice(0, revealed).map((s, idx) => (
            <li key={idx} style={{ fontFamily: "'Outfit'", fontSize: 16, lineHeight: 1.5, marginBottom: 10, color: palette.ink, animation: "fadein .35s ease" }}>
              {s}
            </li>
          ))}
        </ol>

        {revealed < ex.steps.length ? (
          <button onClick={() => setRevealed(revealed + 1)} style={{ ...navBtn, margin: "8px 0 0" }}>
            Révéler l'étape {revealed + 1} →
          </button>
        ) : (
          <button onClick={() => setShowAns(true)} style={{ ...navBtn, margin: "8px 0 0", borderColor: palette.teal, color: palette.teal }}>
            Voir la réponse finale ✓
          </button>
        )}

        {showAns && (
          <div style={{ marginTop: 18, padding: "16px 20px", background: palette.teal, color: "#fff", borderRadius: 10, fontFamily: "'Space Mono', monospace", fontSize: 18, lineHeight: 1.5 }}>
            {ex.answer}
          </div>
        )}
      </div>
    </div>
  );
}

// ============================================================
// MÉMO EXPRESS
// ============================================================
function Memo() {
  const blocks = [
    {
      title: "Compter les mots",
      color: palette.rust,
      items: [
        "Alphabet de taille k, mots de longueur n  →  kⁿ mots.",
        "Mots de longueur ≤ n  →  k⁰ + k¹ + … + kⁿ.",
        "Mot de longueur n  →  n + 1 préfixes (avec ε).",
      ],
    },
    {
      title: "Opérations régulières",
      color: palette.gold,
      items: [
        "Puissance Lⁿ · Concaténation L₁L₂ · Réunion L₁+L₂.",
        "Étoile L* = {ε} + L + L² + …  (contient ε).",
        "Itéré positif L⁺ = L + L² + …  (PAS ε en général).",
        "(a+b)* = tous les mots sur {a,b}.",
      ],
    },
    {
      title: "Automate déterministe : 3 conditions",
      color: palette.teal,
      items: [
        "1) Aucun arc étiqueté ε.",
        "2) Un seul état initial.",
        "3) Pour chaque état q et chaque lettre x : au plus un arc x sortant.",
      ],
    },
    {
      title: "Déterminisation (sous-ensembles)",
      color: palette.plum,
      items: [
        "État de départ = {état initial}.",
        "Nouvel état = ensemble des états atteints par une lettre.",
        "On itère jusqu'à stabilité.",
        "Final = tout ensemble contenant un état final d'origine.",
      ],
    },
    {
      title: "Lemme d'Arden",
      color: palette.rust,
      items: [
        "D = aD + b   ⟹   D = a*b.",
        "X = AX + B   ⟹   X = A*B   (A sans ε).",
        "Méthode : une équation Dᵢ par état, +ε si état final, résoudre par substitution.",
      ],
    },
    {
      title: "Théorème de Kleene (constructions)",
      color: palette.gold,
      items: [
        "Réunion : nouvel init → ε → A₁ et A₂.",
        "Concaténation : A₁ → ε → A₂.",
        "A⁺ : boucle ε de la sortie vers l'entrée.",
        "A* : comme A⁺ + chemin ε qui saute A (accepte ε).",
      ],
    },
    {
      title: "Grammaires (TD4)",
      color: palette.teal,
      items: [
        "S → aSb | ε  engendre  {aⁿbⁿ}.",
        "Pour {a²ⁿbcⁿ³…} : reproduire la symétrie dans la règle.",
        "ε termine toujours la dérivation.",
      ],
    },
  ];

  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 16 }}>
      {blocks.map((b, idx) => (
        <div key={idx} style={{ background: palette.cream, border: `2px solid ${palette.ink}`, borderRadius: 14, padding: 20, position: "relative", overflow: "hidden" }}>
          <div style={{ position: "absolute", top: 0, left: 0, width: 8, height: "100%", background: b.color }} />
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 700, marginBottom: 12, color: palette.ink, paddingLeft: 6 }}>
            {b.title}
          </div>
          <ul style={{ margin: 0, paddingLeft: 22 }}>
            {b.items.map((it, j) => (
              <li key={j} style={{ fontFamily: "'Outfit'", fontSize: 15, lineHeight: 1.5, marginBottom: 8, color: palette.ink }}>{it}</li>
            ))}
          </ul>
        </div>
      ))}
    </div>
  );
}
